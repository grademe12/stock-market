<path d="M200 255 H270 V199 H370" fill="none" stroke="#0f62fe" stroke-width="3" stroke-dasharray="8 5"></path>
<path d="M475 140 V160 M395 160 H555 M395 160 V176 M448 160 V176 M502 160 V176 M555 160 V176" fill="none" stroke="#161616" stroke-width="1.5"></path>
<path d="M300 352 H420 V320" fill="none" stroke="#d1621f" stroke-width="4"></path>
<g font-family="-apple-system, BlinkMacSystemFont, Apple SD Gothic Neo, Pretendard Variable, Pretendard, sans-serif" font-size="13" fill="#161616">
<text x="32" y="308" text-anchor="start" font-size="12" fill="#8d8d8d">집 (미니 PC)</text>
<text x="608" y="308" text-anchor="end" font-size="12" fill="#8d8d8d">Azure VM · koreacentral</text>
