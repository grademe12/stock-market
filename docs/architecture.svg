<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" width="640" height="380" role="img" aria-label="stock-market 구성도: 집의 미니 PC에서 participant-runner가 Tailnet을 거쳐 Azure VM의 gateway :8000으로 주문을 보냅니다. gateway는 종목을 보고 127.0.0.1에서만 듣는 매칭 프로세스 4개 중 하나로 넘깁니다. 매칭 프로세스는 미니 PC의 PostgreSQL에서 트레이더와 종목 정보를 읽고, 미니 PC의 Prometheus가 지표를 수집합니다. 배포는 GitHub Actions가 이미지를 GHCR에 올리고 Run Command로 VM에 반영합니다. VM에 공개 포트는 없습니다.">
<rect width="640" height="380" fill="#fff"></rect>
<defs><pattern id="stock-grid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#f0f0f0" stroke-width="1"></path></pattern></defs>
<rect width="640" height="380" fill="url(#stock-grid)"></rect>
<rect x="20" y="20" width="210" height="300" fill="none" stroke="#8d8d8d" stroke-width="1"></rect>
<rect x="300" y="20" width="320" height="300" fill="none" stroke="#8d8d8d" stroke-width="1"></rect>
<path d="M200 70 H270 V120 H330" fill="none" stroke="#0f62fe" stroke-width="3" stroke-dasharray="8 5"></path>
