services:
  runner:
    build:
      context: ..
      dockerfile: participant-runner/Dockerfile
    image: stock-market-participant-runner
    env_file:
      - .env
    environment:
      TRADER_STRATEGIES: ${RUNNER_STRATEGIES:-}
      SIMULATION_MARKET_MODE: ${SIMULATION_MARKET_MODE:-scheduled}
      RUNNER_SHARD_INDEX: ${RUNNER_SHARD_INDEX:-}
      METRICS_PORT: ${METRICS_PORT:-0}
      METRICS_BIND: ${METRICS_BIND:-0.0.0.0}
    network_mode: host
    restart: unless-stopped
    stop_grace_period: 30s
