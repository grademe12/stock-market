services:
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    image: stock-market-dashboard:local
    network_mode: host
    dns:
      - 100.100.100.100
    dns_search:
      - ${TAILSCALE_DNS_SEARCH:?set TAILSCALE_DNS_SEARCH}
    env_file:
      - .env
    environment:
      HOSTNAME: ${FRONTEND_BIND_ADDRESS:-127.0.0.1}
      PORT: "3000"
    restart: unless-stopped
