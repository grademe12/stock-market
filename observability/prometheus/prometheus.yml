global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus-self:9090"]

  - job_name: stock-market-backend
    metrics_path: /metrics/
    http_sd_configs:
      - url: http://stock-market-gce:8000/api/v1/prometheus-sd/
        refresh_interval: 30s

  - job_name: stock-market-backend-readiness
    metrics_path: /probe
    params:
      module: [http_2xx]
    http_sd_configs:
      - url: http://stock-market-gce:8000/api/v1/prometheus-sd/
        refresh_interval: 30s
    relabel_configs:
      - source_labels: [__address__]
        regex: (.+)
        replacement: http://$1/api/v1/ready/
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: 127.0.0.1:9115

  - job_name: stock-market-runner
    metrics_path: /metrics
    static_configs:
      - targets:
          - 127.0.0.1:9101
          - 127.0.0.1:9102
          - 127.0.0.1:9103
          - 127.0.0.1:9104
          - 127.0.0.1:9105
          - 127.0.0.1:9106
          - 127.0.0.1:9107
          - 127.0.0.1:9108
          - 127.0.0.1:9109
          - 127.0.0.1:9110
          - 127.0.0.1:9111
          - 127.0.0.1:9112
