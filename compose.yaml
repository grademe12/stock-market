services:
  postgres:
    image: postgres:17-alpine
    env_file:
      - ${POSTGRES_ENV_FILE:-./db/postgres.env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - ${BACKEND_ENV_FILE:-./db/.env}
      - ${POSTGRES_ENV_FILE:-./db/postgres.env}
    environment:
      DATABASE_ENGINE: postgresql
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      DJANGO_DEBUG: "1"
      TRADE_EXECUTION_LOG_ENABLED: ${TRADE_EXECUTION_LOG_ENABLED:-1}
      DJANGO_SECRET_KEY: local-container-development-key
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,backend
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 4G
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/api/v1/ready/', timeout=2)"
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  participant-runner:
    profiles: ["runner"]
    build:
      context: .
      dockerfile: participant-runner/Dockerfile
    env_file:
      - ${PARTICIPANT_RUNNER_ENV_FILE:-./participant-runner/.env.example}
    environment:
      BACKEND_BASE_URL: http://backend:8000
      SCENARIO_PATH: ${SCENARIO_PATH:-}
    depends_on:
      backend:
        condition: service_healthy

  k6:
    profiles: ["loadtest"]
    image: grafana/k6:latest
    volumes:
      - ./loadtest:/scripts:ro
      - ./.artifacts/loadtest:/results
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres-data:
