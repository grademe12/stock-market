name: Deploy backend

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - backend/**
      - participant-runner/**
      - gateway/**
      - .github/workflows/deploy-backend.yml
      - infra/scripts/remote-deploy.sh
  push:
    branches: [main]
    paths:
      - backend/**
      - participant-runner/**
      - gateway/**
      - .github/workflows/deploy-backend.yml
      - infra/scripts/remote-deploy.sh

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-backend-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run backend tests
        run: make backend-setup backend-test participant-runner-test gateway-test

  validate-infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Validate Terraform
        working-directory: infra
        run: |
          terraform init -backend=false
          terraform fmt -check -recursive
          terraform validate

  deploy:
    needs: [test, validate-infra]
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event.repository.fork == false &&
      vars.GCP_WORKLOAD_IDENTITY_PROVIDER != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Set image names
        run: |
          project="${{ vars.GCP_PROJECT_ID }}"
          region="${{ vars.GCP_REGION }}"
          repository="${{ vars.ARTIFACT_REGISTRY_REPOSITORY }}"
          image="${region}-docker.pkg.dev/${project}/${repository}/backend"
          gateway="${region}-docker.pkg.dev/${project}/${repository}/gateway"
          echo "REGISTRY_HOST=${region}-docker.pkg.dev" >> "$GITHUB_ENV"
          echo "IMAGE=${image}:${GITHUB_SHA}" >> "$GITHUB_ENV"
          echo "GATEWAY_IMAGE=${gateway}:${GITHUB_SHA}" >> "$GITHUB_ENV"

      - name: Build and push backend and gateway images
        run: |
          gcloud auth configure-docker "${REGISTRY_HOST}" --quiet
          docker build -f backend/Dockerfile -t "${IMAGE}" .
          docker build -f gateway/Dockerfile -t "${GATEWAY_IMAGE}" .
          docker push "${IMAGE}"
          docker push "${GATEWAY_IMAGE}"

      - name: Deploy image to the backend VM
        env:
          GCE_INSTANCE: ${{ vars.GCE_INSTANCE }}
          GCE_ZONE: ${{ vars.GCE_ZONE }}
        run: |
          gcloud compute scp \
            --quiet \
            --tunnel-through-iap \
            --zone "${GCE_ZONE}" \
            infra/scripts/remote-deploy.sh \
            "${GCE_INSTANCE}:/tmp/remote-deploy.sh"
          gcloud compute ssh "${GCE_INSTANCE}" \
            --quiet \
            --tunnel-through-iap \
            --zone "${GCE_ZONE}" \
            --command "chmod 700 /tmp/remote-deploy.sh && sudo GATEWAY_IMAGE='${GATEWAY_IMAGE}' bash /tmp/remote-deploy.sh '${IMAGE}' '${REGISTRY_HOST}'"
